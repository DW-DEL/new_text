<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f1f3f5;
      font-family: system-ui, sans-serif;
    }

    .calculator {
      width: min(320px, calc(100vw - 32px));
      padding: 20px;
      border-radius: 16px;
      background: #222;
      box-shadow: 0 12px 30px #0003;
    }

    #display {
      width: 100%;
      height: 64px;
      margin-bottom: 14px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #222;
      font-size: 2rem;
      text-align: right;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      min-height: 56px;
      border: 0;
      border-radius: 8px;
      background: #444;
      color: #fff;
      font-size: 1.25rem;
      cursor: pointer;
    }

    button:hover {
      background: #5a5a5a;
    }

    button:focus-visible {
      outline: 3px solid #9cc9ff;
      outline-offset: 2px;
    }

    button.operator {
      background: #f09a36;
    }

    button.operator:hover {
      background: #ffad4d;
    }

    button.clear {
      background: #a94343;
    }

    button.equals {
      grid-column: span 2;
      background: #397c55;
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <input id="display" type="text" value="0" aria-label="Display" readonly>
    <div class="buttons">
      <button class="clear" data-action="clear">C</button>
      <button data-action="delete" aria-label="Delete last digit">⌫</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="+">+</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value=".">.</button>

      <button data-value="0">0</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </main>

  <script>
    const display = document.querySelector("#display");
    const buttons = document.querySelector(".buttons");
    let expression = "";
    let justCalculated = false;

    function updateDisplay(value = expression || "0") {
      display.value = value;
    }

    function calculate() {
      if (!expression || !/^[\d+\-*/.()\s]+$/.test(expression)) return;

      try {
        const result = Function(`"use strict"; return (${expression})`)();
        if (!Number.isFinite(result)) throw new Error("Invalid result");
        expression = String(Number(result.toFixed(10)));
        updateDisplay();
        justCalculated = true;
      } catch {
        expression = "";
        updateDisplay("Error");
      }
    }

    buttons.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const { action, value } = button.dataset;

      if (action === "clear") {
        expression = "";
        justCalculated = false;
        updateDisplay();
      } else if (action === "delete") {
        expression = expression.slice(0, -1);
        justCalculated = false;
        updateDisplay();
      } else if (action === "equals") {
        calculate();
      } else if (value) {
        if (justCalculated && /[\d.]/.test(value)) expression = "";
        justCalculated = false;
        expression += value;
        updateDisplay();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (/^[\d+\-*/.]$/.test(event.key)) {
        if (justCalculated && /[\d.]/.test(event.key)) expression = "";
        justCalculated = false;
        expression += event.key;
        updateDisplay();
      } else if (event.key === "Enter" || event.key === "=") {
        calculate();
      } else if (event.key === "Backspace") {
        expression = expression.slice(0, -1);
        updateDisplay();
      } else if (event.key === "Escape") {
        expression = "";
        justCalculated = false;
        updateDisplay();
      }
    });
  </script>
</body>
</html>
